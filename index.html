<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="i计算">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/128/891/891175.png">
    <title>i预算计算器</title>
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #ffffff;
            --accent: #5856D6;
            --text: #1C1C1E;
            --gray: #8E8E93;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 50px 20px 15px;
            background: var(--card-bg);
            text-align: center;
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .total-label { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }
        .total-amount { font-size: 34px; font-weight: 700; color: var(--accent); margin-top: 5px; }

        .history-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #F9F9F9;
        }

        .log-item {
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 18px;
            color: #777;
            display: flex;
            justify-content: flex-end; /* 靠右对齐：关键修改 */
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .log-item.budget-item {
            background: #EFEEFF;
            color: var(--accent);
            font-weight: 600;
            border-left: 5px solid var(--accent); /* 改回：邊框回到左邊 */
            border-right: none; /* 改回：去掉右邊框 */
        }

        .log-expr { margin-right: 10px; word-break: break-all; }
        .log-res { white-space: nowrap; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-display {
            padding: 15px 25px;
            text-align: right;
            background: white;
            border-top: 1px solid #eee;
        }

        #display { font-size: 44px; font-weight: 300; color: var(--text); min-height: 54px; }
        #expr-display { font-size: 14px; color: var(--gray); height: 18px; margin-bottom: 4px; overflow: hidden; }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 15px 15px 35px;
            background: white;
        }

        button {
            height: 62px;
            border-radius: 16px;
            border: none;
            font-size: 22px;
            font-weight: 500;
            background: var(--bg-color);
            color: var(--text);
            transition: transform 0.05s, background 0.1s;
        }

        button:active { transform: scale(0.92); background: #E5E5EA; }

        .btn-op { background: #F2F2F7; color: var(--accent); }
        .btn-add { 
            grid-column: span 2; 
            background: var(--accent); 
            color: white; 
            font-size: 17px;
            font-weight: 600;
        }
        .btn-clear { color: #FF3B30; }

    </style>
</head>
<body>

    <div class="header">
        <div class="total-label">清单总预算</div>
        <div class="total-amount">¥ <span id="total-val">0.00</span></div>
    </div>

    <div class="history-container" id="history-box"></div>

    <div class="input-display">
        <div id="expr-display"></div>
        <div id="display">0</div>
    </div>

    <div class="keypad">
        <button class="btn-clear" onclick="reset()">AC</button>
        <button class="btn-op" onclick="press('/')">÷</button>
        <button class="btn-op" onclick="press('*')">×</button>
        <button onclick="backspace()">⌫</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="btn-op" onclick="press('-')">-</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="btn-op" onclick="press('+')">+</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button class="btn-op" onclick="solve(true)">=</button>

        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button class="btn-add" onclick="addToBudget()">加入预算清单</button>
    </div>

    <script>
        let currentInput = "";
        let totalBudget = 0;
        let isFinished = false; // 新增：标记是否刚完成一次计算
        
        const historyBox = document.getElementById('history-box');
        const displayEl = document.getElementById('display');
        const exprEl = document.getElementById('expr-display');

        function press(key) {
            const operators = ['+', '-', '*', '/'];
            const lastChar = currentInput.slice(-1); // 获取最后一个字符

            // 如果刚算完结果 (isFinished 为 true)
            if (isFinished) {
                if (!operators.includes(key)) {
                    currentInput = ""; // 如果按的是数字，清空重新开始
                }
                isFinished = false; // 重置状态
            }

            // 逻辑处理：防止连续输入两个运算符
            if (operators.includes(key)) {
                if (currentInput === "" || currentInput === "0") {
                    // 如果开头就按运算符，只有负号 "-" 是允许的
                    if (key === '-') currentInput = "-"; 
                    else return; 
                } else if (operators.includes(lastChar)) {
                    // 如果最后一位已经是运算符，直接替换成新的运算符
                    currentInput = currentInput.slice(0, -1) + key;
                } else {
                    currentInput += key;
                }
            } else {
                // 如果输入的是数字
                if (currentInput === "0") currentInput = "";
                currentInput += key;
            }
            
            updateDisplay();
        }

        function updateDisplay() {
            displayEl.innerText = currentInput || "0";
            exprEl.innerText = currentInput;
        }

        function reset() {
            currentInput = "";
            isFinished = false;
            exprEl.innerText = "";
            displayEl.innerText = "0";
        }

        function backspace() {
            if(isFinished) return; // 结果状态下不允许退格
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        function solve(isManualEqual = false) {
            if (!currentInput) return;
            
            // 自动修正：如果末尾是运算符（如 "5+"），计算前先去掉它
            let expression = currentInput;
            const operators = ['+', '-', '*', '/'];
            while (operators.includes(expression.slice(-1))) {
                expression = expression.slice(0, -1);
            }

            try {
                let safeExpr = expression.replace(/×/g, '*').replace(/÷/g, '/');
                let result = eval(safeExpr);
                
                if (result % 1 !== 0) result = parseFloat(result.toFixed(8));

                if (isManualEqual) {
                    // 只有当有实际运算过程时才记录（防止点两遍等号重复记录）
                    if (expression !== String(result)) {
                        addLogItem(`${expression} =`, `${result}`, false);
                        currentInput = String(result); // 更新结果
                    }
                    isFinished = true; 
                } else {
                    currentInput = String(result);
                }

                displayEl.innerText = result;
                return result;
            } catch {
                displayEl.innerText = "错误";
                return null;
            }
        }

        function addLogItem(left, right, isBudget = false) {
            const div = document.createElement('div');
            div.className = isBudget ? 'log-item budget-item' : 'log-item';
            div.innerHTML = `<span class="log-expr">${left}</span><span class="log-res">${right}</span>`;
            historyBox.appendChild(div);
            historyBox.scrollTop = historyBox.scrollHeight;
        }

        function addToBudget() {
            let expression = currentInput;
            if(!expression || expression === "0") return;

            let result = solve(false); 
            if(result === null) return;
            
            let val = parseFloat(result);
            totalBudget += val;
            document.getElementById('total-val').innerText = totalBudget.toFixed(2);

            // 加入预算时，如果刚才已经算过结果了(isFinished)，就显示结果，否则显示过程
            let displayExpr = (isFinished) ? "入账" : expression;
            addLogItem(`${displayExpr} =`, `+ ¥${val.toFixed(2)}`, true);

            reset();
        }
        // 检查浏览器是否支持离线缓存
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('离线功能已就绪！', reg))
                    .catch(err => console.log('离线功能启动失败', err));
            });
        }
    </script>
</body>
</html>
